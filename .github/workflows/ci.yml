# Revisa tipos, corre los tests y compila en cada push y pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # .env no está en git: el build toma la URL de la API del ejemplo
      - run: cp .env.example .env

      - run: npm run type-check

      - run: npm test

      - run: npm run build-only
